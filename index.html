<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forklift & Pallet Detector</title>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 14px 0; }
  button { background: #2563eb; color: #fff; border: 0; padding: 9px 18px; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: default; }
  input[type=number] { width: 70px; padding: 6px; }
  canvas { max-width: 100%; border: 1px solid #ddd; border-radius: 6px; display: none; }
  #summary { margin: 10px 0; font-size: 16px; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; color: #fff; margin-right: 8px; font-size: 14px; }
</style>
</head>
<body>
<h1>Forklift &amp; Pallet Detector</h1>

<div class="row">
  <input type="file" id="file" accept="image/*">
  <label>Confidence <input type="number" id="conf" value="0.25" min="0.01" max="0.99" step="0.05"></label>
  <button id="go" disabled>Detect</button>
</div>

<div id="summary"></div>
<canvas id="canvas"></canvas>

<script>
const COLORS = { Forklift: "#f97316", Pallet: "#2563eb" };
const fileInput = document.getElementById("file");
const goBtn = document.getElementById("go");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const summary = document.getElementById("summary");
let img = null;

fileInput.addEventListener("change", () => {
  const f = fileInput.files[0];
  if (!f) return;
  img = new Image();
  img.onload = () => {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    ctx.drawImage(img, 0, 0);
    canvas.style.display = "block";
    summary.textContent = "";
    goBtn.disabled = false;
  };
  img.src = URL.createObjectURL(f);
});

goBtn.addEventListener("click", async () => {
  goBtn.disabled = true;
  summary.textContent = "Detecting...";
  try {
    const form = new FormData();
    form.append("file", fileInput.files[0]);
    const conf = document.getElementById("conf").value;
    const res = await fetch("/predict?conf=" + conf, { method: "POST", body: form });
    if (!res.ok) throw new Error("Server error " + res.status);
    draw(await res.json());
  } catch (e) {
    summary.textContent = "Error: " + e.message;
  }
  goBtn.disabled = false;
});

function draw(data) {
  ctx.drawImage(img, 0, 0);
  const line = Math.max(2, Math.round(canvas.width / 400));
  const font = Math.max(14, Math.round(canvas.width / 50));
  ctx.lineWidth = line;
  ctx.font = "bold " + font + "px Arial";
  const counts = {};
  for (const d of data.detections) {
    counts[d.class] = (counts[d.class] || 0) + 1;
    const [x1, y1, x2, y2] = d.bbox;
    const color = COLORS[d.class] || "#16a34a";
    ctx.strokeStyle = color;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const label = d.class + " " + Math.round(d.confidence * 100) + "%";
    const w = ctx.measureText(label).width + 8;
    const top = Math.max(0, y1 - font - 4);
    ctx.fillStyle = color;
    ctx.fillRect(x1, top, w, font + 4);
    ctx.fillStyle = "#fff";
    ctx.fillText(label, x1 + 4, top + font);
  }
  summary.innerHTML = data.count === 0
    ? "No objects found. Try lowering the confidence."
    : Object.entries(counts).map(([c, n]) =>
        '<span class="tag" style="background:' + (COLORS[c] || "#16a34a") + '">' + c + ": " + n + "</span>").join("");
}
</script>
</body>
</html>
